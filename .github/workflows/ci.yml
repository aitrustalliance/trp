name: TRP Conformance CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    name: Schema validation & evaluator conformance
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install jsonschema

      - name: Run conformance test suite
        run: python tests/run_conformance.py --verbose

      - name: Check release archives carry no build output or local paths
        run: python tests/release_hygiene_check.py

      - name: Check the TRP checkpoint for MCP
        run: python tests/mcp_checkpoint_check.py

      - name: Check Verifiable Trust Receipts in Python and Node.js
        run: pip install cryptography && python tests/vtr_check.py

      - name: Check the MCP checkpoint with the official MCP SDK client
        run: pip install "mcp==2.3.0" && python tests/mcp_checkpoint_sdk.py

      - name: Validate schema is valid JSON Schema
        run: |
          python -c "
          import json, jsonschema
          with open('schema/trp.schema.json') as f:
              schema = json.load(f)
          jsonschema.Draft202012Validator.check_schema(schema)
          print('Schema is a valid JSON Schema (2020-12)')
          "

      - name: Run evaluator against manufacturing example
        run: |
          python tools/evaluate.py \
            examples/manufacturing-safety/trp.json \
            --generate-sample > /tmp/sample.json
          python tools/evaluate.py \
            examples/manufacturing-safety/trp.json \
            /tmp/sample.json

      - name: Run evaluator against healthcare example
        run: |
          python tools/evaluate.py \
            examples/healthcare-data-governance/trp.json \
            --generate-sample > /tmp/sample.json
          python tools/evaluate.py \
            examples/healthcare-data-governance/trp.json \
            /tmp/sample.json

  cross-evaluator:
    name: Cross-evaluator agreement (Python + Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install jsonschema

      - name: Cross-validate evaluators and result_hash against all evidence
        run: python tests/cross_evaluator_check.py

      - name: Check scored signal value types in both evaluators
        run: python tests/scored_signal_types_check.py

  otel-export:
    name: OpenTelemetry export (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check the export with no OpenTelemetry package installed
        run: python tests/otel_check.py
      - name: Check the export with the OpenTelemetry SDK and the OTLP message classes
        run: pip install "opentelemetry-sdk==1.45.2" "opentelemetry-proto==1.45.2" && python tests/otel_sdk_check.py
      - name: Type check and lint the export
        if: matrix.python-version == '3.12'
        run: |
          pip install "mypy==2.4.1" "ruff==0.16.8"
          ruff check --select E,F,W,I,B,UP,SIM,RUF --line-length 120 --target-version py310 adapters/otel tests/otel_check.py tests/otel_sdk_check.py
          MYPYPATH=vtr/tools:tools:adapters/otel mypy --strict --follow-imports=silent --python-version 3.10 adapters/otel/trp_otel.py tests/otel_check.py tests/otel_sdk_check.py

  oscal:
    name: OSCAL export and import (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Export every profile, validate against the official OSCAL 1.2.3 schemas and import NIST's own catalogs
        run: pip install jsonschema && python tests/oscal_check.py
      - name: Type check and lint the tool
        if: matrix.python-version == '3.12'
        run: |
          pip install "mypy==2.4.1" "ruff==0.16.8"
          ruff check --select E,F,W,I,B,UP,SIM,RUF --line-length 120 --target-version py310 tools/trp_oscal.py tests/oscal_check.py
          MYPYPATH=vtr/tools:tools mypy --strict --follow-imports=silent --python-version 3.10 tools/trp_oscal.py tests/oscal_check.py

  agent-frameworks:
    name: Agent framework adapters (${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: langchain
            install: "langchain==1.4.8 langgraph==1.2.19"
          - framework: openai_agents
            install: "openai-agents==0.24.0"
          - framework: google_adk
            install: "google-adk==2.13.0"
          - framework: crewai
            install: "crewai==1.15.34"
          - framework: ag2
            install: "ag2==1.2.2"
    env:
      OPENAI_API_KEY: unused
      OTEL_SDK_DISABLED: "true"
      CREWAI_DISABLE_TELEMETRY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ${{ matrix.framework }}
        run: pip install jsonschema ${{ matrix.install }}
      - name: Run the framework through the TRP gate with a scripted model
        run: PYTHONPATH=adapters/frameworks python tests/frameworks/${{ matrix.framework }}_check.py

  a2a:
    name: A2A adapter with in-process a2a-sdk agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a2a-sdk
        run: pip install jsonschema cryptography "a2a-sdk[http-server]==1.3.0" "starlette==1.10.0" "sse-starlette==3.6.0"
      - name: Run the A2A adapter checks
        run: python tests/a2a_check.py
