name: Publish TRP Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the Studio engine before publishing
        run: node tests/studio_parity.js

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r studio examples schema _site/
          cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>TRP Studio</title>
          <meta http-equiv="refresh" content="0; url=studio/">
          <a href="studio/">Open TRP Studio</a>
          HTML

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
